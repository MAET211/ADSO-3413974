<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1340" width="100%" height="100%">
  <defs>
    <style>
      .hdr-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 19px; font-weight: bold; fill: #1A365D; }
      .hdr-sub { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #4A5568; }
      .diag-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #2D3748; }
      .lane-box { fill: #FFFFFF; stroke: #A0AEC0; stroke-width: 1.5; }
      .lane-header { fill: #EDF2F7; stroke: #A0AEC0; stroke-width: 1.5; }
      .lane-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: bold; fill: #2D3748; text-anchor: middle; }
      
      .activity-box { fill: #EBF8FF; stroke: #3182CE; stroke-width: 1.6; rx: 10; }
      .activity-sys { fill: #FEFCBF; stroke: #D69E2E; stroke-width: 1.6; rx: 10; }
      .activity-fin { fill: #F0FFF4; stroke: #38A169; stroke-width: 1.6; rx: 10; }
      .activity-alt { fill: #FFF5F5; stroke: #E53E3E; stroke-width: 1.6; rx: 10; }
      .act-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #1A202C; text-anchor: middle; }
      
      .decision-node { fill: #FFF5F5; stroke: #E53E3E; stroke-width: 1.8; }
      .merge-node { fill: #EDF2F7; stroke: #718096; stroke-width: 1.6; }
      .guard-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: bold; fill: #C53030; }
      .guard-ok { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: bold; fill: #2F855A; }
      .guard-pill { fill: #FFFFFF; opacity: 0.96; rx: 3; }
      
      .flow-line { stroke: #4A5568; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow-alt { stroke: #E53E3E; stroke-width: 1.6; stroke-dasharray: 5,4; fill: none; marker-end: url(#arrow-red); }
      .fork-bar { fill: #1A202C; rx: 2; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4A5568" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E53E3E" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1300" height="1340" fill="#F8FAFC" />

  <!-- Header Banner -->
  <rect x="25" y="15" width="1250" height="58" fill="#FFFFFF" stroke="#CBD5E0" rx="8" />
  <text x="45" y="39" class="hdr-title">SISTEMA GESTOR DE AMBULANCIAS (SGA) — DIAGRAMAS DE ACTIVIDADES UML</text>
  <text x="45" y="57" class="hdr-sub">Evidencia G1-P2 · Criterio C1 (RAP 592373) · Aprendiz: MAET211 (Carpeta: G1-P2-estrada) · Calles por actor, guardas [ ] y concurrencia Fork/Join</text>

  <!-- ========================================================================= -->
  <!-- DIAGRAMA 1: TRIAGE Y DESPACHO AUTOMÁTICO DE AMBULANCIAS (CU-03)           -->
  <!-- ========================================================================= -->
  
  <text x="40" y="96" class="diag-title">1. Diagrama de Actividades: Triage y Despacho Automático de Ambulancia (CU-03 / CU-02)</text>

  <!-- Swimlanes Diagram 1 -->
  <rect x="40" y="110" width="370" height="520" class="lane-box" />
  <rect x="40" y="110" width="370" height="30" class="lane-header" />
  <text x="225" y="130" class="lane-title">Coordinador Operativo (Despacho)</text>

  <rect x="410" y="110" width="510" height="520" class="lane-box" />
  <rect x="410" y="110" width="510" height="30" class="lane-header" />
  <text x="665" y="130" class="lane-title">Motor de Despacho SGA (Sistema Automático)</text>

  <rect x="920" y="110" width="340" height="520" class="lane-box" />
  <rect x="920" y="110" width="340" height="30" class="lane-header" />
  <text x="1090" y="130" class="lane-title">Tripulación Asistencial (TAB / TAM)</text>

  <!-- Nodes Diagram 1 -->
  <circle cx="85" cy="175" r="10" fill="#2D3748" />

  <rect x="130" y="155" width="250" height="40" class="activity-box" />
  <text x="255" y="179" class="act-text">Recibir llamada y radicar solicitud</text>

  <rect x="130" y="225" width="250" height="40" class="activity-box" />
  <text x="255" y="249" class="act-text">Asignar prioridad clínica (Triage)</text>

  <rect x="530" y="225" width="260" height="40" class="activity-sys" />
  <text x="660" y="249" class="act-text">Evaluar complejidad y filtrar flota (RN-002)</text>

  <!-- Decision 1: Complejidad TAB vs TAM (centered at 660, 320) -->
  <polygon points="660,295 710,320 660,345 610,320" class="decision-node" />

  <rect x="450" y="368" width="170" height="38" class="activity-sys" />
  <text x="535" y="391" class="act-text">Filtrar unidades TAM</text>

  <rect x="710" y="368" width="170" height="38" class="activity-sys" />
  <text x="795" y="391" class="act-text">Filtrar unidades TAB</text>

  <!-- Merge 1 (centered at 660, 435) -->
  <polygon points="660,420 690,435 660,450 630,435" class="merge-node" />

  <!-- Decision 2: Disponibilidad y REPS (centered at 660, 495) -->
  <polygon points="660,470 710,495 660,520 610,495" class="decision-node" />

  <!-- Excepción: Sin unidades o REPS vencido -->
  <rect x="130" y="475" width="250" height="40" class="activity-alt" />
  <text x="255" y="499" class="act-text">Activar protocolo manual / CRUE</text>

  <circle cx="80" cy="495" r="10" fill="#E53E3E" />
  <circle cx="80" cy="495" r="14" fill="none" stroke="#E53E3E" stroke-width="1.5" />

  <!-- Act 1.5: Asignar y Despachar -->
  <rect x="640" y="565" width="250" height="40" class="activity-sys" />
  <text x="765" y="589" class="act-text">Asignar unidad y emitir orden despacho</text>

  <!-- Act 1.6: Tripulación -->
  <rect x="945" y="565" width="245" height="40" class="activity-fin" />
  <text x="1067" y="589" class="act-text">Confirmar salida y pasar a 'En Ruta'</text>

  <circle cx="1225" cy="585" r="10" fill="#2D3748" />
  <circle cx="1225" cy="585" r="14" fill="none" stroke="#2D3748" stroke-width="1.5" />

  <!-- Connectors Diagram 1 -->
  <line x1="95" y1="175" x2="130" y2="175" class="flow-line" />
  <line x1="255" y1="195" x2="255" y2="225" class="flow-line" />
  <line x1="380" y1="245" x2="530" y2="245" class="flow-line" />
  <line x1="660" y1="265" x2="660" y2="295" class="flow-line" />

  <!-- Decision 1 Branches (clean space before labels) -->
  <path d="M 610 320 L 535 320 L 535 368" class="flow-line" />
  <rect x="432" y="297" width="160" height="16" class="guard-pill" />
  <text x="512" y="309" class="guard-text" text-anchor="middle">[Prioridad Rojo / Naranja]</text>

  <path d="M 710 320 L 795 320 L 795 368" class="flow-line" />
  <rect x="720" y="297" width="175" height="16" class="guard-pill" />
  <text x="807" y="309" class="guard-ok" text-anchor="middle">[Prioridad Verde / Amarillo]</text>

  <path d="M 535 406 L 535 435 L 630 435" class="flow-line" />
  <path d="M 795 406 L 795 435 L 690 435" class="flow-line" />
  <line x1="660" y1="450" x2="660" y2="470" class="flow-line" />

  <!-- Decision 2 Branches (strictly orthogonal!) -->
  <path d="M 660 520 L 660 565" class="flow-line" />
  <rect x="668" y="532" width="168" height="16" class="guard-pill" />
  <text x="672" y="544" class="guard-ok">[Disponible y REPS al día]</text>

  <line x1="610" y1="495" x2="380" y2="495" class="flow-alt" />
  <rect x="415" y="472" width="180" height="16" class="guard-pill" />
  <text x="505" y="484" class="guard-text" text-anchor="middle">[Sin unidades o REPS vencido]</text>

  <line x1="130" y1="495" x2="94" y2="495" class="flow-line" />
  <line x1="890" y1="585" x2="945" y2="585" class="flow-line" />
  <line x1="1190" y1="585" x2="1211" y2="585" class="flow-line" />


  <!-- ========================================================================= -->
  <!-- DIAGRAMA 2: CIERRE FORMAL DE SERVICIO Y LIQUIDACIÓN INMUTABLE (CU-05)     -->
  <!-- ========================================================================= -->
  
  <text x="40" y="672" class="diag-title">2. Diagrama de Actividades: Cierre Formal de Servicio y Concurrencia Operativa (CU-05 / CU-11 / CU-06)</text>

  <!-- Swimlanes Diagram 2 -->
  <rect x="40" y="688" width="370" height="620" class="lane-box" />
  <rect x="40" y="688" width="370" height="30" class="lane-header" />
  <text x="225" y="708" class="lane-title">Paramédico en Campo (Tripulación)</text>

  <rect x="410" y="688" width="460" height="620" class="lane-box" />
  <rect x="410" y="688" width="460" height="30" class="lane-header" />
  <text x="640" y="708" class="lane-title">Sistema Central SGA (Reglas de Negocio)</text>

  <rect x="870" y="688" width="390" height="620" class="lane-box" />
  <rect x="870" y="688" width="390" height="30" class="lane-header" />
  <text x="1065" y="708" class="lane-title">Flota, Facturación Inmutable y Auditoría</text>

  <!-- Nodes Diagram 2 -->
  <circle cx="85" cy="755" r="10" fill="#2D3748" />

  <rect x="130" y="735" width="250" height="40" class="activity-box" />
  <text x="255" y="759" class="act-text">Finalizar traslado médico en IPS destino</text>

  <rect x="130" y="805" width="250" height="40" class="activity-box" />
  <text x="255" y="829" class="act-text">Diligenciar datos clínicos y cierre (RN-005)</text>

  <rect x="480" y="805" width="260" height="40" class="activity-sys" />
  <text x="610" y="829" class="act-text">Validar completitud y consistencia REPS</text>

  <!-- Decision 3: Validación RN-005 (centered at 610, 905) -->
  <polygon points="610,880 660,905 610,930 560,905" class="decision-node" />

  <!-- Act 2.4: Transicionar a Finalizado -->
  <rect x="480" y="985" width="260" height="40" class="activity-sys" />
  <text x="610" y="1009" class="act-text">Transicionar estado servicio a 'Finalizado'</text>

  <!-- Fork Bar (strictly vertical bar x=825, spanning 3 parallel tracks!) -->
  <rect x="825" y="945" width="12" height="125" class="fork-bar" />

  <!-- 3 Parallel Activities in Lane 3 (ALL connected through Fork and Join!) -->
  <rect x="900" y="915" width="250" height="38" class="activity-fin" />
  <text x="1025" y="938" class="act-text">Liberar ambulancia a 'Disponible'</text>

  <rect x="900" y="985" width="250" height="38" class="activity-fin" />
  <text x="1025" y="1008" class="act-text">Generar factura inmutable (CU-11)</text>

  <rect x="900" y="1055" width="250" height="38" class="activity-fin" />
  <text x="1025" y="1078" class="act-text">Registrar evento en auditoría (CU-06)</text>

  <!-- Join Bar (strictly inside Lane 3 at x=1200) -->
  <rect x="1200" y="945" width="12" height="125" class="fork-bar" />

  <!-- Archivar y Fin -->
  <rect x="900" y="1165" width="260" height="40" class="activity-box" />
  <text x="1030" y="1189" class="act-text">Archivar expediente asistencial cerrado</text>

  <circle cx="1030" cy="1260" r="10" fill="#2D3748" />
  <circle cx="1030" cy="1260" r="14" fill="none" stroke="#2D3748" stroke-width="1.5" />

  <!-- Connectors Diagram 2 -->
  <line x1="95" y1="755" x2="130" y2="755" class="flow-line" />
  <line x1="255" y1="775" x2="255" y2="805" class="flow-line" />
  <line x1="380" y1="825" x2="480" y2="825" class="flow-line" />
  <line x1="610" y1="845" x2="610" y2="880" class="flow-line" />

  <!-- Branches Decision 3 -->
  <line x1="610" y1="930" x2="610" y2="985" class="flow-line" />
  <rect x="618" y="945" width="200" height="16" class="guard-pill" />
  <text x="622" y="957" class="guard-ok">[Campos obligatorios diligenciados]</text>

  <!-- Rejection Loop cleanly into bottom of Act 2.2 (zero label overlap!) -->
  <path d="M 560 905 L 255 905 L 255 845" class="flow-alt" />
  <rect x="295" y="882" width="240" height="16" class="guard-pill" />
  <text x="415" y="894" class="guard-text" text-anchor="middle">[Datos incompletos (Bloqueo RN-005)]</text>

  <!-- Act 2.4 -> Fork -->
  <line x1="740" y1="1005" x2="825" y2="1005" class="flow-line" />

  <!-- Fork -> 3 Concurrent Acts -->
  <path d="M 837 965 L 865 965 L 865 934 L 900 934" class="flow-line" />
  <line x1="837" y1="1004" x2="900" y2="1004" class="flow-line" />
  <path d="M 837 1045 L 865 1045 L 865 1074 L 900 1074" class="flow-line" />

  <!-- 3 Concurrent Acts -> Join -->
  <path d="M 1150 934 L 1178 934 L 1178 965 L 1200 965" class="flow-line" />
  <line x1="1150" y1="1004" x2="1200" y2="1004" class="flow-line" />
  <path d="M 1150 1074 L 1178 1074 L 1178 1045 L 1200 1045" class="flow-line" />

  <!-- Join -> Archivar -> Final (strictly inside Lane 3!) -->
  <path d="M 1212 1005 L 1235 1005 L 1235 1185 L 1160 1185" class="flow-line" />
  <line x1="1030" y1="1205" x2="1030" y2="1246" class="flow-line" />

</svg>
