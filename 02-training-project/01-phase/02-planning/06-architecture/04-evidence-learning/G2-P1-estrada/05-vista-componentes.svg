  <text x="130" y="136" font-family="Consolas, Segoe UI, sans-serif" font-size="10.5" fill="#1e293b">Provee: IVistaOperativaSGA | Requiere: IAutenticacion, IGestionPQRS, IFacturacionServicio, IGestionEmergencias, IGestionFlota</text>
  <text x="130" y="151" font-family="Consolas, Segoe UI, sans-serif" font-size="10.5" fill="#1e293b">Regla arquitectónica: Consume solo interfaces de negocio vía HTTPS/WSS; cero acceso directo a base de datos.</text>
