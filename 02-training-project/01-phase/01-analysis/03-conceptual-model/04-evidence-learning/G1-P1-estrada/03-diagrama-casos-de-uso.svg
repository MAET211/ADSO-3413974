<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 945" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1A365D; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #4A5568; }
      .system-box { fill: #F8FAFC; stroke: #2D3748; stroke-width: 2.2; rx: 8; }
      .boundary-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1A202C; letter-spacing: 0.4px; }
      .subsystem-box { fill: #FFFFFF; stroke: #CBD5E0; stroke-width: 1.5; stroke-dasharray: 5,4; rx: 6; }
      .subsystem-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #718096; }

      .actor-head { fill: #FFFFFF; stroke: #2B6CB0; stroke-width: 2; }
      .actor-body { stroke: #2B6CB0; stroke-width: 2; stroke-linecap: round; }
      .actor-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: bold; fill: #2D3748; text-anchor: middle; }
      .actor-sub { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; fill: #718096; text-anchor: middle; }

      .uc-ellipse { fill: #FEFCBF; stroke: #D69E2E; stroke-width: 1.8; }
      .uc-ellipse-core { fill: #FFF5F5; stroke: #E53E3E; stroke-width: 2; }
      .uc-ellipse-sec { fill: #EBF8FF; stroke: #3182CE; stroke-width: 1.8; }
      .uc-ellipse-fin { fill: #F0FFF4; stroke: #38A169; stroke-width: 1.8; }

      .uc-id { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: bold; fill: #2D3748; text-anchor: middle; }
      .uc-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #1A202C; text-anchor: middle; }

      .assoc-line { stroke: #4A5568; stroke-width: 1.5; fill: none; }
      .sys-line { stroke: #C53030; stroke-width: 1.5; fill: none; }
      .include-line { stroke: #3182CE; stroke-width: 1.6; stroke-dasharray: 5,4; fill: none; marker-end: url(#arrow-inc); }
      .extend-line { stroke: #E53E3E; stroke-width: 1.6; stroke-dasharray: 5,4; fill: none; marker-end: url(#arrow-ext); }
      .stereo-inc { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; font-style: italic; font-weight: bold; fill: #2C5282; text-anchor: middle; }
      .stereo-ext { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; font-style: italic; font-weight: bold; fill: #C53030; text-anchor: middle; }
    </style>

    <marker id="arrow-inc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#3182CE" stroke-width="1.6" />
    </marker>
    <marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#E53E3E" stroke-width="1.6" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1320" height="945" fill="#F8FAFC" />

  <!-- Header Banner -->
  <rect x="20" y="15" width="1280" height="60" fill="#FFFFFF" stroke="#E2E8F0" rx="8" />
  <text x="40" y="40" class="title">SISTEMA GESTOR DE AMBULANCIAS (SGA) — DIAGRAMA DE CASOS DE USO UML</text>
  <text x="40" y="59" class="subtitle">Evidencia G1-P1 | Programa ADSO Ficha 3413974 | Aprendiz: MAET211 (Carpeta: G1-P1-estrada) | Res. 3100 de 2019 / REPS</text>

  <!-- ==================== SYSTEM BOUNDARY ==================== -->
  <rect x="250" y="90" width="820" height="835" class="system-box" />
  <text x="270" y="114" class="boundary-title">FRONTERA DEL SISTEMA: SISTEMA GESTOR DE AMBULANCIAS (SGA)</text>

  <!-- Subsystem 1: Seguridad y Acceso -->
  <rect x="270" y="130" width="780" height="195" class="subsystem-box" />
  <text x="285" y="146" class="subsystem-label">Módulo: Autenticación, Auditoría y Control de Acceso (RBAC)</text>

  <!-- Subsystem 2: Núcleo Operativo de Emergencias -->
  <rect x="270" y="340" width="780" height="305" class="subsystem-box" />
  <text x="285" y="358" class="subsystem-label">Módulo: Gestión Operativa, Triage y Despacho de Unidades TAB / TAM</text>

  <!-- Subsystem 3: Administrativo y Financiero -->
  <rect x="270" y="660" width="780" height="205" class="subsystem-box" />
  <text x="285" y="678" class="subsystem-label">Módulo: Inventario Habilitado REPS, Facturación y Calidad (PQRS)</text>

  <!-- ==================== ACTORS (LEFT SIDE — PLANAR TOPOLOGICAL ORDER) ==================== -->

  <!-- Actor 1 (Top Ops): Coordinador Operativo -->
  <g transform="translate(100, 345)">
    <circle cx="20" cy="18" r="13" class="actor-head" />
    <line x1="20" y1="31" x2="20" y2="66" class="actor-body" />
    <line x1="2" y1="42" x2="38" y2="42" class="actor-body" />
    <line x1="20" y1="66" x2="6" y2="94" class="actor-body" />
    <line x1="20" y1="66" x2="34" y2="94" class="actor-body" />
    <text x="20" y="112" class="actor-label">Coordinador</text>
    <text x="20" y="125" class="actor-sub">(Despacho y Triage)</text>
  </g>

  <!-- Actor 2 (Mid Ops): Paramédico TAB / TAM -->
  <g transform="translate(100, 520)">
    <circle cx="20" cy="18" r="13" class="actor-head" />
    <line x1="20" y1="31" x2="20" y2="66" class="actor-body" />
    <line x1="2" y1="42" x2="38" y2="42" class="actor-body" />
    <line x1="20" y1="66" x2="6" y2="94" class="actor-body" />
    <line x1="20" y1="66" x2="34" y2="94" class="actor-body" />
    <text x="20" y="112" class="actor-label">Paramédico</text>
    <text x="20" y="125" class="actor-sub">(Líder Tripulación)</text>
  </g>

  <!-- Actor 3 (Admin): Administrador (Alineado con CU-08 para evitar cruces) -->
  <g transform="translate(100, 665)">
    <circle cx="20" cy="18" r="13" class="actor-head" />
    <line x1="20" y1="31" x2="20" y2="66" class="actor-body" />
    <line x1="2" y1="42" x2="38" y2="42" class="actor-body" />
    <line x1="20" y1="66" x2="6" y2="94" class="actor-body" />
    <line x1="20" y1="66" x2="34" y2="94" class="actor-body" />
    <text x="20" y="112" class="actor-label">Administrador</text>
    <text x="20" y="125" class="actor-sub">(Gestión y Control)</text>
  </g>

  <!-- Actor 4: Usuario / Ciudadano -->
  <g transform="translate(100, 785)">
    <circle cx="20" cy="18" r="13" class="actor-head" />
    <line x1="20" y1="31" x2="20" y2="66" class="actor-body" />
    <line x1="2" y1="42" x2="38" y2="42" class="actor-body" />
    <line x1="20" y1="66" x2="6" y2="94" class="actor-body" />
    <line x1="20" y1="66" x2="34" y2="94" class="actor-body" />
    <text x="20" y="112" class="actor-label">Ciudadano</text>
    <text x="20" y="125" class="actor-sub">(Usuario Externo PQRS)</text>
  </g>

  <!-- ==================== ACTOR (RIGHT SIDE - SYSTEM DEMON) ==================== -->

  <!-- Actor 5: Demonio Sistema SGA (Cron / Background) -->
  <g transform="translate(1175, 395)">
    <rect x="0" y="0" width="52" height="72" rx="6" fill="#EDF2F7" stroke="#C53030" stroke-width="2" />
    <line x1="8" y1="18" x2="44" y2="18" stroke="#C53030" stroke-width="2" />
    <line x1="8" y1="36" x2="44" y2="36" stroke="#C53030" stroke-width="2" />
    <circle cx="40" cy="54" r="3.5" fill="#38A169" />
    <circle cx="28" cy="54" r="3.5" fill="#3182CE" />
    <text x="26" y="94" class="actor-label">Sistema SGA</text>
    <text x="26" y="108" class="actor-sub">(Demonio / Background)</text>
  </g>

  <!-- ==================== USE CASES ==================== -->

  <!-- Subsystem 1 Use Cases -->
  <g transform="translate(305, 152)">
    <ellipse cx="92" cy="29" rx="92" ry="29" class="uc-ellipse-sec" />
    <text x="92" y="24" class="uc-id">CU-01</text>
    <text x="92" y="40" class="uc-text">Autenticar Usuario y Emitir JWT</text>
  </g>

  <g transform="translate(615, 152)">
    <ellipse cx="92" cy="29" rx="92" ry="29" class="uc-ellipse" />
    <text x="92" y="24" class="uc-id">CU-01.1</text>
    <text x="92" y="40" class="uc-text">Bloquear por Intentos Fallidos</text>
  </g>

  <g transform="translate(850, 252)">
    <ellipse cx="92" cy="29" rx="92" ry="29" class="uc-ellipse-sec" />
    <text x="92" y="24" class="uc-id">CU-06</text>
    <text x="92" y="40" class="uc-text">Auditar Evento Inmutable</text>
  </g>

  <!-- Subsystem 2 Use Cases -->
  <g transform="translate(305, 368)">
    <ellipse cx="92" cy="29" rx="92" ry="29" class="uc-ellipse-core" />
    <text x="92" y="24" class="uc-id">CU-02</text>
    <text x="92" y="40" class="uc-text">Radicar Solicitud Emergencia</text>
  </g>

  <g transform="translate(615, 368)">
    <ellipse cx="92" cy="29" rx="92" ry="29" class="uc-ellipse-core" />
    <text x="92" y="24" class="uc-id">CU-03 [CRÍTICO]</text>
    <text x="92" y="40" class="uc-text">Asignar Unidad Automática</text>
  </g>

  <g transform="translate(305, 475)">
    <ellipse cx="92" cy="29" rx="92" ry="29" class="uc-ellipse-sec" />
    <text x="92" y="24" class="uc-id">CU-07</text>
    <text x="92" y="40" class="uc-text">Monitorear Flota WebSockets</text>
  </g>

  <g transform="translate(615, 475)">
    <ellipse cx="92" cy="29" rx="92" ry="29" class="uc-ellipse" />
    <text x="92" y="24" class="uc-id">CU-04 [CRÍTICO]</text>
    <text x="92" y="40" class="uc-text">Asignar con Justificación Manual</text>
  </g>

  <g transform="translate(615, 570)">
    <ellipse cx="92" cy="29" rx="92" ry="29" class="uc-ellipse-core" />
    <text x="92" y="24" class="uc-id">CU-05 [CRÍTICO]</text>
    <text x="92" y="40" class="uc-text">Realizar Cierre Formal Servicio</text>
  </g>

  <!-- Subsystem 3 Use Cases -->
  <g transform="translate(305, 682)">
    <ellipse cx="92" cy="29" rx="92" ry="29" class="uc-ellipse" />
    <text x="92" y="24" class="uc-id">CU-08</text>
    <text x="92" y="40" class="uc-text">Gestionar Flota Ambulancias</text>
  </g>

  <g transform="translate(585, 682)">
    <ellipse cx="92" cy="29" rx="92" ry="29" class="uc-ellipse-sec" />
    <text x="92" y="24" class="uc-id">CU-09</text>
    <text x="92" y="40" class="uc-text">Validar Habilitación REPS</text>
  </g>

  <g transform="translate(850, 682)">
    <ellipse cx="92" cy="29" rx="92" ry="29" class="uc-ellipse-fin" />
    <text x="92" y="24" class="uc-id">CU-11</text>
    <text x="92" y="40" class="uc-text">Generar Factura Inmutable</text>
  </g>

  <g transform="translate(420, 795)">
    <ellipse cx="95" cy="29" rx="95" ry="29" class="uc-ellipse-sec" />
    <text x="95" y="24" class="uc-id">CU-10</text>
    <text x="95" y="40" class="uc-text">Radicar y Consultar PQRS</text>
  </g>

  <!-- ==================== ORTHOGONAL ZERO-CROSSING ASSOCIATIONS ==================== -->

  <!-- Coordinador to CU-01 (corridor x=215) -->
  <path d="M 145 365 L 215 365 L 215 181 L 305 181" class="assoc-line" />
  <!-- Coordinador to CU-02 -->
  <line x1="145" y1="397" x2="305" y2="397" class="assoc-line" />
  <!-- Coordinador to CU-04 (corridor y=450 strictly between CU-02/03 and CU-07/04) -->
  <path d="M 145 422 L 235 422 L 235 450 L 565 450 L 565 504 L 615 504" class="assoc-line" />
  <!-- Coordinador to CU-07 (corridor x=215, ends before 235) -->
  <path d="M 145 445 L 215 445 L 215 504 L 305 504" class="assoc-line" />

  <!-- Paramédico to CU-01 (corridor x=68 -> top y=118) -->
  <path d="M 95 560 L 68 560 L 68 118 L 365 118 L 365 152" class="assoc-line" />
  <!-- Paramédico to CU-05 (horizontal clear space y=599) -->
  <line x1="145" y1="599" x2="615" y2="599" class="assoc-line" />

  <!-- Administrador to CU-01 (outermost left x=35 -> top y=100) -->
  <path d="M 95 700 L 35 700 L 35 100 L 425 100 L 425 152" class="assoc-line" />
  <!-- Administrador to CU-08 (straight horizontal!) -->
  <line x1="145" y1="711" x2="305" y2="711" class="assoc-line" />

  <!-- Ciudadano to CU-10 -->
  <line x1="145" y1="824" x2="420" y2="824" class="assoc-line" />

  <!-- Demonio Sistema SGA (Right Side) Orthogonal Corridors -->
  <!-- To CU-01.1 (outermost x=1140 -> y=181) -->
  <path d="M 1175 412 L 1140 412 L 1140 181 L 800 181" class="sys-line" />
  <!-- To CU-03 (middle x=1120 -> y=231 entre CU-01.1 y CU-06 -> baja x=707) -->
  <path d="M 1175 428 L 1120 428 L 1120 231 L 707 231 L 707 368" class="sys-line" />
  <!-- To CU-06 (inner x=1100 -> y=281) -->
  <path d="M 1175 444 L 1100 444 L 1100 281 L 1035 281" class="sys-line" />
  <!-- To CU-09 (lower x=1140 -> y=768 -> x=677) -->
  <path d="M 1175 460 L 1140 460 L 1140 768 L 677 768 L 677 740" class="sys-line" />

  <!-- ==================== UML STEREOTYPES: INCLUDE & EXTEND ==================== -->

  <!-- CU-01.1 extends CU-01 -->
  <line x1="615" y1="181" x2="490" y2="181" class="extend-line" />
  <rect x="515" y="162" width="74" height="14" fill="#FFFFFF" rx="2" />
  <text x="552" y="173" class="stereo-ext">&lt;&lt;extend&gt;&gt;</text>

  <!-- CU-02 includes CU-03 -->
  <line x1="490" y1="397" x2="615" y2="397" class="include-line" />
  <rect x="515" y="378" width="74" height="14" fill="#FFFFFF" rx="2" />
  <text x="552" y="389" class="stereo-inc">&lt;&lt;include&gt;&gt;</text>

  <!-- CU-04 extends CU-03 (vertical corridor) -->
  <line x1="707" y1="475" x2="707" y2="426" class="extend-line" />
  <rect x="713" y="443" width="74" height="14" fill="#FFFFFF" rx="2" />
  <text x="750" y="454" class="stereo-ext">&lt;&lt;extend&gt;&gt;</text>

  <!-- CU-08 includes CU-09 -->
  <line x1="490" y1="711" x2="585" y2="711" class="include-line" />
  <rect x="500" y="692" width="74" height="14" fill="#FFFFFF" rx="2" />
  <text x="537" y="703" class="stereo-inc">&lt;&lt;include&gt;&gt;</text>

  <!-- CU-05 includes CU-06 (clean corridor x=825) -->
  <path d="M 800 588 L 825 588 L 825 281 L 850 281" class="include-line" />
  <rect x="788" y="320" width="74" height="14" fill="#FFFFFF" rx="2" />
  <text x="825" y="331" class="stereo-inc">&lt;&lt;include&gt;&gt;</text>

  <!-- CU-05 includes CU-11 (clean right-drop to x=942) -->
  <path d="M 800 612 L 942 612 L 942 682" class="include-line" />
  <rect x="835" y="593" width="74" height="14" fill="#FFFFFF" rx="2" />
  <text x="872" y="604" class="stereo-inc">&lt;&lt;include&gt;&gt;</text>

  <!-- ==================== CONVENCIONES Y LEYENDA ==================== -->
  <g transform="translate(270, 878)">
    <rect x="0" y="0" width="780" height="32" fill="#EDF2F7" stroke="#CBD5E0" rx="4" />
    <text x="20" y="20" font-family="'Segoe UI', sans-serif" font-size="11px" font-weight="bold" fill="#4A5568">Convenciones UML:</text>
    
    <line x1="145" y1="16" x2="180" y2="16" class="assoc-line" />
    <text x="188" y="20" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#4A5568">Asociación Directa</text>

    <line x1="330" y1="16" x2="365" y2="16" class="include-line" />
    <text x="373" y="20" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#2C5282">&lt;&lt;include&gt;&gt; Inclusión Obligatoria</text>

    <line x1="570" y1="16" x2="605" y2="16" class="extend-line" />
    <text x="613" y="20" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#C53030">&lt;&lt;extend&gt;&gt; Extensión Condicional</text>
  </g>

</svg>
