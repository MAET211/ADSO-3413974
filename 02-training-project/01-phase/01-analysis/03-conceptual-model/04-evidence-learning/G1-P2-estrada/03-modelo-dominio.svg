<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="100%" height="100%">
  <defs>
    <style>
      .hdr-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 19px; font-weight: bold; fill: #1A365D; }
      .hdr-sub { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #4A5568; }
      .class-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: bold; fill: #1A202C; text-anchor: middle; }
      .class-attr { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #2D3748; }
      .mult-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: bold; fill: #2B6CB0; }
      .assoc-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-style: italic; fill: #718096; }

      /* Class boxes */
      .class-header-core { fill: #EBF8FF; stroke: #3182CE; stroke-width: 1.5; }
      .class-body-core { fill: #FFFFFF; stroke: #3182CE; stroke-width: 1.5; }

      .class-header-gen { fill: #FEFCBF; stroke: #D69E2E; stroke-width: 1.5; }
      .class-body-gen { fill: #FFFFFF; stroke: #D69E2E; stroke-width: 1.5; }

      .class-header-fin { fill: #F0FFF4; stroke: #38A169; stroke-width: 1.5; }
      .class-body-fin { fill: #FFFFFF; stroke: #38A169; stroke-width: 1.5; }

      /* Lines */
      .assoc-line { stroke: #4A5568; stroke-width: 1.5; fill: none; }
      .gen-line { stroke: #D69E2E; stroke-width: 1.5; fill: none; marker-end: url(#gen-triangle); }
    </style>

    <!-- Generalization triangle marker -->
    <marker id="gen-triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#FFFFFF" stroke="#D69E2E" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="950" fill="#F8FAFC" />

  <!-- Title Banner -->
  <rect x="20" y="15" width="1160" height="60" fill="#FFFFFF" stroke="#CBD5E0" rx="8" />
  <text x="40" y="40" class="hdr-title">SISTEMA GESTOR DE AMBULANCIAS (SGA) — MODELO DE DOMINIO CONCEPTUAL</text>
  <text x="40" y="58" class="hdr-sub">Evidencia G1-P2 · Criterio C3 (RAP 592373) · Aprendiz: MAET211 (Carpeta: G1-P2-estrada) · Clases puras sin métodos ni claves foráneas físicas</text>

  <!-- ==================== CLASSES (ENTIDADES DE DOMINIO) ==================== -->

  <!-- 1. Paciente -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="200" height="28" class="class-header-core" />
    <text x="100" y="19" class="class-title">Paciente</text>
    <rect x="0" y="28" width="200" height="95" class="class-body-core" />
    <text x="12" y="46" class="class-attr">• numeroIdentificacion</text>
    <text x="12" y="63" class="class-attr">• nombreCompleto</text>
    <text x="12" y="80" class="class-attr">• edad</text>
    <text x="12" y="97" class="class-attr">• antecedenteMedico</text>
    <text x="12" y="114" class="class-attr">• contactoFamiliar</text>
  </g>

  <!-- 2. SolicitudEmergencia -->
  <g transform="translate(320, 110)">
    <rect x="0" y="0" width="210" height="28" class="class-header-core" />
    <text x="105" y="19" class="class-title">SolicitudEmergencia</text>
    <rect x="0" y="28" width="210" height="110" class="class-body-core" />
    <text x="12" y="46" class="class-attr">• codigoRadicado</text>
    <text x="12" y="63" class="class-attr">• fechaHoraLlamada</text>
    <text x="12" y="80" class="class-attr">• direccionIncidente</text>
    <text x="12" y="97" class="class-attr">• sintomatologiaInicial</text>
    <text x="12" y="114" class="class-attr">• nivelTriage (Rojo/Naranja/...)</text>
    <text x="12" y="131" class="class-attr">• nombreReportante</text>
  </g>

  <!-- 3. ServicioAsistencial (Clase Central Core) -->
  <g transform="translate(620, 110)">
    <rect x="0" y="0" width="240" height="28" class="class-header-core" />
    <text x="120" y="19" class="class-title">ServicioAsistencial</text>
    <rect x="0" y="28" width="240" height="145" class="class-body-core" />
    <text x="12" y="46" class="class-attr">• estado (Solicitado/En ruta/Cerrado)</text>
    <text x="12" y="63" class="class-attr">• fechaHoraDespacho</text>
    <text x="12" y="80" class="class-attr">• fechaHoraArribo</text>
    <text x="12" y="97" class="class-attr">• fechaHoraCierre</text>
    <text x="12" y="114" class="class-attr">• resultadoAtencion</text>
    <text x="12" y="131" class="class-attr">• estadoFinalPaciente</text>
    <text x="12" y="148" class="class-attr">• centroHospitalarioDestino</text>
    <text x="12" y="165" class="class-attr">• motivoAsignacionManual</text>
  </g>

  <!-- 4. Ambulancia (Clase Base) -->
  <g transform="translate(940, 110)">
    <rect x="0" y="0" width="220" height="28" class="class-header-gen" />
    <text x="110" y="19" class="class-title">Ambulancia</text>
    <rect x="0" y="28" width="220" height="110" class="class-body-gen" />
    <text x="12" y="46" class="class-attr">• placa</text>
    <text x="12" y="63" class="class-attr">• numeroUnidad</text>
    <text x="12" y="80" class="class-attr">• estadoOperativo (Disponible/...)</text>
    <text x="12" y="97" class="class-attr">• anioModelo</text>
    <text x="12" y="114" class="class-attr">• habilitacionREPS</text>
    <text x="12" y="131" class="class-attr">• vigenciaSoatTecnomecanica</text>
  </g>

  <!-- 5. Generalización: TAB (Básica) -->
  <g transform="translate(860, 310)">
    <rect x="0" y="0" width="160" height="28" class="class-header-gen" />
    <text x="80" y="19" class="class-title">TAB (Básica)</text>
    <rect x="0" y="28" width="160" height="55" class="class-body-gen" />
    <text x="12" y="46" class="class-attr">• kitInmovilizacion</text>
    <text x="12" y="63" class="class-attr">• soporteOxigenoBasico</text>
  </g>

  <!-- 6. Generalización: TAM (Medicalizada) -->
  <g transform="translate(1040, 310)">
    <rect x="0" y="0" width="150" height="28" class="class-header-gen" />
    <text x="75" y="19" class="class-title">TAM (Medicalizada)</text>
    <rect x="0" y="28" width="150" height="70" class="class-body-gen" />
    <text x="12" y="46" class="class-attr">• monitorSignosVitales</text>
    <text x="12" y="63" class="class-attr">• desfibriladorBifasico</text>
    <text x="12" y="80" class="class-attr">• ventiladorMecanico</text>
  </g>

  <!-- 7. PersonalSalud -->
  <g transform="translate(620, 370)">
    <rect x="0" y="0" width="240" height="28" class="class-header-core" />
    <text x="120" y="19" class="class-title">PersonalSalud</text>
    <rect x="0" y="28" width="240" height="110" class="class-body-core" />
    <text x="12" y="46" class="class-attr">• documentoIdentidad</text>
    <text x="12" y="63" class="class-attr">• nombreCompleto</text>
    <text x="12" y="80" class="class-attr">• tarjetaProfesional</text>
    <text x="12" y="97" class="class-attr">• rolTripulacion (Médico/Paramédico)</text>
    <text x="12" y="114" class="class-attr">• certificacionSoporteVital</text>
    <text x="12" y="131" class="class-attr">• horasTurnoAcumuladas</text>
  </g>

  <!-- 8. Factura -->
  <g transform="translate(620, 570)">
    <rect x="0" y="0" width="240" height="28" class="class-header-fin" />
    <text x="120" y="19" class="class-title">Factura</text>
    <rect x="0" y="28" width="240" height="110" class="class-body-fin" />
    <text x="12" y="46" class="class-attr">• numeroFactura</text>
    <text x="12" y="63" class="class-attr">• fechaEmision</text>
    <text x="12" y="80" class="class-attr">• valorTotalServicio</text>
    <text x="12" y="97" class="class-attr">• estadoPago (Pagada/Mora)</text>
    <text x="12" y="114" class="class-attr">• diasMoraCalculados</text>
    <text x="12" y="131" class="class-attr">• inmutable : Booleano (Si/No)</text>
  </g>

  <!-- 9. NovedadOperativa -->
  <g transform="translate(320, 370)">
    <rect x="0" y="0" width="210" height="28" class="class-header-core" />
    <text x="105" y="19" class="class-title">NovedadOperativa</text>
    <rect x="0" y="28" width="210" height="95" class="class-body-core" />
    <text x="12" y="46" class="class-attr">• tipoIncidente (Falla/Accidente)</text>
    <text x="12" y="63" class="class-attr">• prioridad (Baja/Media/Alta)</text>
    <text x="12" y="80" class="class-attr">• descripcionDetallada</text>
    <text x="12" y="97" class="class-attr">• estadoResolucion</text>
    <text x="12" y="114" class="class-attr">• fechaReporte</text>
  </g>

  <!-- 10. PQRS -->
  <g transform="translate(40, 370)">
    <rect x="0" y="0" width="200" height="28" class="class-header-core" />
    <text x="100" y="19" class="class-title">PQRS</text>
    <rect x="0" y="28" width="200" height="95" class="class-body-core" />
    <text x="12" y="46" class="class-attr">• codigoRadicado</text>
    <text x="12" y="63" class="class-attr">• tipo (Peticion/Queja/Reclamo)</text>
    <text x="12" y="80" class="class-attr">• descripcionMotivo</text>
    <text x="12" y="97" class="class-attr">• fechaVencimientoLegal</text>
    <text x="12" y="114" class="class-attr">• estado (Radicada/Respondida)</text>
  </g>

  <!-- 11. RegistroAuditoria -->
  <g transform="translate(320, 570)">
    <rect x="0" y="0" width="210" height="28" class="class-header-fin" />
    <text x="105" y="19" class="class-title">RegistroAuditoria</text>
    <rect x="0" y="28" width="210" height="95" class="class-body-fin" />
    <text x="12" y="46" class="class-attr">• fechaHoraEvento</text>
    <text x="12" y="63" class="class-attr">• accionRealizada</text>
    <text x="12" y="80" class="class-attr">• moduloAfectado</text>
    <text x="12" y="97" class="class-attr">• direccionIPOrigen</text>
    <text x="12" y="114" class="class-attr">• retencionAnios (5 años)</text>
  </g>


  <!-- ==================== ASSOCIATIONS & MULTIPLICITIES ==================== -->

  <!-- Paciente to SolicitudEmergencia -->
  <line x1="240" y1="160" x2="320" y2="160" class="assoc-line" />
  <text x="245" y="152" class="mult-text">1</text>
  <text x="300" y="152" class="mult-text">1..*</text>
  <text x="252" y="175" class="assoc-label">origina</text>

  <!-- SolicitudEmergencia to ServicioAsistencial -->
  <line x1="530" y1="160" x2="620" y2="160" class="assoc-line" />
  <text x="535" y="152" class="mult-text">1</text>
  <text x="605" y="152" class="mult-text">1</text>
  <text x="548" y="175" class="assoc-label">despacha</text>

  <!-- ServicioAsistencial to Ambulancia -->
  <line x1="860" y1="160" x2="940" y2="160" class="assoc-line" />
  <text x="865" y="152" class="mult-text">0..*</text>
  <text x="920" y="152" class="mult-text">1</text>
  <text x="872" y="175" class="assoc-label">atiende con</text>

  <!-- Generalization: Ambulancia -> TAB and TAM -->
  <path d="M 940 310 L 940 250 L 1050 250 L 1050 220" class="gen-line" />
  <path d="M 1115 310 L 1115 250 L 1050 250" class="gen-line" />

  <!-- ServicioAsistencial to PersonalSalud -->
  <line x1="740" y1="255" x2="740" y2="370" class="assoc-line" />
  <text x="745" y="275" class="mult-text">1..*</text>
  <text x="745" y="360" class="mult-text">1..*</text>
  <text x="660" y="315" class="assoc-label">tripulado por (N:M)</text>

  <!-- ServicioAsistencial to Factura -->
  <path d="M 860 210 L 890 210 L 890 625 L 860 625" class="assoc-line" />
  <text x="865" y="202" class="mult-text">1</text>
  <text x="865" y="618" class="mult-text">0..1</text>
  <text x="900" y="420" class="assoc-label">liquida en</text>

  <!-- ServicioAsistencial to NovedadOperativa -->
  <path d="M 620 200 L 425 200 L 425 370" class="assoc-line" />
  <text x="600" y="192" class="mult-text">1</text>
  <text x="430" y="360" class="mult-text">0..*</text>
  <text x="435" y="235" class="assoc-label">reporta</text>

  <!-- PersonalSalud to RegistroAuditoria -->
  <path d="M 620 420 L 530 420 L 530 570" class="assoc-line" />
  <text x="600" y="412" class="mult-text">1</text>
  <text x="535" y="560" class="mult-text">0..*</text>
  <text x="540" y="465" class="assoc-label">trazado en</text>

  <!-- Paciente to PQRS -->
  <line x1="140" y1="205" x2="140" y2="370" class="assoc-line" />
  <text x="145" y="225" class="mult-text">0..1</text>
  <text x="145" y="360" class="mult-text">0..*</text>
  <text x="150" y="290" class="assoc-label">radica</text>

  <!-- ==================== LEYENDA TÉCNICA ==================== -->
  <g transform="translate(40, 840)">
    <rect x="0" y="0" width="1120" height="70" fill="#EDF2F7" stroke="#CBD5E0" rx="6" />
    <text x="20" y="25" font-family="'Segoe UI', sans-serif" font-size="11.5px" font-weight="bold" fill="#2D3748">Normas Técnicas Aplicadas en el Modelo de Dominio (Criterio C3 / Sección 7 Regla 5 de la Rúbrica):</text>
    <text x="20" y="44" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#4A5568">1. Clases Conceptuales Puras: Muestran ontología del negocio prehospitalario, libres de tipos de datos de base de datos física, métodos o sentencias SQL.</text>
    <text x="20" y="59" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#4A5568">2. Generalización Normativa: Se modela la especialización de Ambulancia en TAB y TAM conforme a los estándares de habilitación de la Resolución 3100 de 2019.</text>
  </g>

</svg>
