<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1A365D; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #4A5568; }
      .boundary-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #2B6CB0; letter-spacing: 1px; }
      .actor-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #2D3748; text-anchor: middle; }
      .actor-sub { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #718096; text-anchor: middle; }
      .uc-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #1A202C; text-anchor: middle; }
      .uc-id { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #2B6CB0; text-anchor: middle; }
      .stereo-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; font-style: italic; fill: #C53030; font-weight: bold; }
      .stereo-inc { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; font-style: italic; fill: #2C5282; font-weight: bold; }
      
      /* Shapes styling */
      .actor-head { fill: #EBF8FF; stroke: #3182CE; stroke-width: 2; }
      .actor-body { stroke: #3182CE; stroke-width: 2; stroke-linecap: round; }
      .system-box { fill: #FFFFFF; stroke: #CBD5E0; stroke-width: 2.5; stroke-dasharray: 8 6; rx: 12; }
      .subsystem-box { fill: #F7FAFC; stroke: #E2E8F0; stroke-width: 1.5; rx: 8; }
      .subsystem-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #718096; text-transform: uppercase; letter-spacing: 0.5px; }
      
      .uc-ellipse { fill: #FEFCBF; stroke: #D69E2E; stroke-width: 1.8; }
      .uc-ellipse-sec { fill: #EBF8FF; stroke: #3182CE; stroke-width: 1.8; }
      .uc-ellipse-core { fill: #FFF5F5; stroke: #E53E3E; stroke-width: 1.8; }
      .uc-ellipse-fin { fill: #F0FFF4; stroke: #38A169; stroke-width: 1.8; }

      /* Connectors */
      .assoc-line { stroke: #4A5568; stroke-width: 1.5; fill: none; }
      .include-line { stroke: #3182CE; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow-blue); }
      .extend-line { stroke: #E53E3E; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow-red); }
    </style>
    
    <!-- Marker definitions for UML relationships -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3182CE" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E53E3E" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="900" fill="#F8FAFC" />

  <!-- Header Banner -->
  <rect x="20" y="15" width="1160" height="65" fill="#FFFFFF" stroke="#E2E8F0" rx="8" />
  <text x="40" y="42" class="title">SISTEMA GESTOR DE AMBULANCIAS (SGA) — DIAGRAMA DE CASOS DE USO UML</text>
  <text x="40" y="62" class="subtitle">Evidencia G1-P1 | Programa ADSO Ficha 3413974 | Aprendiz: Miguel Ángel Estrada Torrentes (estrada) | Res. 3100 de 2019 / REPS</text>

  <!-- ==================== SYSTEM BOUNDARY ==================== -->
  <rect x="230" y="95" width="740" height="785" class="system-box" />
  <text x="250" y="125" class="boundary-title">FRONTERA DEL SISTEMA: SISTEMA GESTOR DE AMBULANCIAS (SGA)</text>

  <!-- Subsystem 1: Seguridad y Acceso -->
  <rect x="250" y="145" width="700" height="135" class="subsystem-box" />
  <text x="265" y="165" class="subsystem-label">Módulo: Autenticación, Auditoría y Control de Acceso (RBAC)</text>

  <!-- Subsystem 2: Núcleo Operativo de Emergencias -->
  <rect x="250" y="295" width="700" height="315" class="subsystem-box" />
  <text x="265" y="315" class="subsystem-label">Módulo: Gestión Operativa, Triage y Despacho de Unidades TAB / TAM</text>

  <!-- Subsystem 3: Administrativo y Financiero -->
  <rect x="250" y="625" width="700" height="235" class="subsystem-box" />
  <text x="265" y="645" class="subsystem-label">Módulo: Inventario Habilitado REPS, Facturación y Calidad (PQRS)</text>

  <!-- ==================== ACTORS (LEFT SIDE) ==================== -->
  
  <!-- Actor 1: Administrador -->
  <g transform="translate(100, 150)">
    <circle cx="20" cy="20" r="14" class="actor-head" />
    <line x1="20" y1="34" x2="20" y2="70" class="actor-body" />
    <line x1="0" y1="46" x2="40" y2="46" class="actor-body" />
    <line x1="20" y1="70" x2="5" y2="100" class="actor-body" />
    <line x1="20" y1="70" x2="35" y2="100" class="actor-body" />
    <text x="20" y="120" class="actor-label">Administrador</text>
    <text x="20" y="134" class="actor-sub">(Gestión y Control)</text>
  </g>

  <!-- Actor 2: Coordinador Operativo -->
  <g transform="translate(100, 360)">
    <circle cx="20" cy="20" r="14" class="actor-head" />
    <line x1="20" y1="34" x2="20" y2="70" class="actor-body" />
    <line x1="0" y1="46" x2="40" y2="46" class="actor-body" />
    <line x1="20" y1="70" x2="5" y2="100" class="actor-body" />
    <line x1="20" y1="70" x2="35" y2="100" class="actor-body" />
    <text x="20" y="120" class="actor-label">Coordinador</text>
    <text x="20" y="134" class="actor-sub">(Despacho y Triage)</text>
  </g>

  <!-- Actor 3: Paramédico TAB / TAM -->
  <g transform="translate(100, 560)">
    <circle cx="20" cy="20" r="14" class="actor-head" />
    <line x1="20" y1="34" x2="20" y2="70" class="actor-body" />
    <line x1="0" y1="46" x2="40" y2="46" class="actor-body" />
    <line x1="20" y1="70" x2="5" y2="100" class="actor-body" />
    <line x1="20" y1="70" x2="35" y2="100" class="actor-body" />
    <text x="20" y="120" class="actor-label">Paramédico</text>
    <text x="20" y="134" class="actor-sub">(Líder de Tripulación)</text>
  </g>

  <!-- Actor 4: Usuario / Ciudadano -->
  <g transform="translate(100, 740)">
    <circle cx="20" cy="20" r="14" class="actor-head" />
    <line x1="20" y1="34" x2="20" y2="70" class="actor-body" />
    <line x1="0" y1="46" x2="40" y2="46" class="actor-body" />
    <line x1="20" y1="70" x2="5" y2="100" class="actor-body" />
    <line x1="20" y1="70" x2="35" y2="100" class="actor-body" />
    <text x="20" y="120" class="actor-label">Ciudadano</text>
    <text x="20" y="134" class="actor-sub">(Usuario Externo PQRS)</text>
  </g>

  <!-- ==================== ACTORS (RIGHT SIDE - SYSTEM DEMON) ==================== -->
  
  <!-- Actor 5: Demonio Sistema SGA (Cron / Background) -->
  <g transform="translate(1060, 430)">
    <rect x="0" y="0" width="50" height="70" rx="6" fill="#EDF2F7" stroke="#4A5568" stroke-width="2" />
    <line x1="8" y1="18" x2="42" y2="18" stroke="#4A5568" stroke-width="2" />
    <line x1="8" y1="35" x2="42" y2="35" stroke="#4A5568" stroke-width="2" />
    <circle cx="38" cy="52" r="3" fill="#38A169" />
    <circle cx="28" cy="52" r="3" fill="#3182CE" />
    <text x="25" y="95" class="actor-label">Sistema SGA</text>
    <text x="25" y="110" class="actor-sub">(Demonio / Background)</text>
  </g>

  <!-- ==================== USE CASES (CASOS DE USO) ==================== -->

  <!-- Subsystem 1 Use Cases -->
  <!-- CU-01: Autenticar Usuario -->
  <g transform="translate(290, 185)">
    <ellipse cx="95" cy="30" rx="95" ry="28" class="uc-ellipse-sec" />
    <text x="95" y="24" class="uc-id">CU-01</text>
    <text x="95" y="39" class="uc-text">Autenticar Usuario y Emitir JWT</text>
  </g>

  <!-- CU-01.1: Bloquear Cuenta -->
  <g transform="translate(560, 185)">
    <ellipse cx="95" cy="30" rx="95" ry="28" class="uc-ellipse" />
    <text x="95" y="24" class="uc-id">CU-01.1</text>
    <text x="95" y="39" class="uc-text">Bloquear por Intentos Fallidos</text>
  </g>

  <!-- CU-06: Auditar Evento -->
  <g transform="translate(780, 185)">
    <ellipse cx="75" cy="30" rx="75" ry="28" class="uc-ellipse-sec" />
    <text x="75" y="24" class="uc-id">CU-06</text>
    <text x="75" y="39" class="uc-text">Auditar Evento Log</text>
  </g>

  <!-- Subsystem 2 Use Cases (Operativo) -->
  <!-- CU-02: Radicar Solicitud -->
  <g transform="translate(275, 345)">
    <ellipse cx="95" cy="30" rx="95" ry="28" class="uc-ellipse-core" />
    <text x="95" y="24" class="uc-id">CU-02</text>
    <text x="95" y="39" class="uc-text">Radicar Solicitud Emergencia</text>
  </g>

  <!-- CU-03: Asignar Ambulancia Automática -->
  <g transform="translate(520, 345)">
    <ellipse cx="105" cy="30" rx="105" ry="28" class="uc-ellipse-core" />
    <text x="105" y="24" class="uc-id">CU-03 [CRÍTICO]</text>
    <text x="105" y="39" class="uc-text">Asignar Unidad Automática</text>
  </g>

  <!-- CU-04: Asignar Manualmente -->
  <g transform="translate(775, 345)">
    <ellipse cx="95" cy="30" rx="95" ry="28" class="uc-ellipse" />
    <text x="95" y="24" class="uc-id">CU-04</text>
    <text x="95" y="39" class="uc-text">Asignar con Justificación</text>
  </g>

  <!-- CU-07: Monitorear en Tiempo Real -->
  <g transform="translate(290, 450)">
    <ellipse cx="95" cy="30" rx="95" ry="28" class="uc-ellipse-sec" />
    <text x="95" y="24" class="uc-id">CU-07</text>
    <text x="95" y="39" class="uc-text">Monitorear Flota WebSockets</text>
  </g>

  <!-- CU-05: Cierre Formal de Servicio -->
  <g transform="translate(540, 520)">
    <ellipse cx="105" cy="30" rx="105" ry="28" class="uc-ellipse-core" />
    <text x="105" y="24" class="uc-id">CU-05 [CRÍTICO]</text>
    <text x="105" y="39" class="uc-text">Cierre Formal de Servicio</text>
  </g>

  <!-- Subsystem 3 Use Cases (Admin, Soporte, Facturación) -->
  <!-- CU-08: Gestionar Inventario Ambulancias -->
  <g transform="translate(280, 665)">
    <ellipse cx="95" cy="30" rx="95" ry="28" class="uc-ellipse" />
    <text x="95" y="24" class="uc-id">CU-08</text>
    <text x="95" y="39" class="uc-text">Gestionar Flota Ambulancias</text>
  </g>

  <!-- CU-09: Controlar Vencimientos Habilitación -->
  <g transform="translate(520, 665)">
    <ellipse cx="95" cy="30" rx="95" ry="28" class="uc-ellipse-sec" />
    <text x="95" y="24" class="uc-id">CU-09</text>
    <text x="95" y="39" class="uc-text">Validar Habilitación REPS</text>
  </g>

  <!-- CU-11: Generar Factura Inmutable -->
  <g transform="translate(775, 665)">
    <ellipse cx="95" cy="30" rx="95" ry="28" class="uc-ellipse-fin" />
    <text x="95" y="24" class="uc-id">CU-11</text>
    <text x="95" y="39" class="uc-text">Generar Factura Inmutable</text>
  </g>

  <!-- CU-10: Radicar y Consultar PQRS -->
  <g transform="translate(400, 775)">
    <ellipse cx="105" cy="30" rx="105" ry="28" class="uc-ellipse-sec" />
    <text x="105" y="24" class="uc-id">CU-10</text>
    <text x="105" y="39" class="uc-text">Radicar y Consultar PQRS</text>
  </g>

  <!-- ==================== ASSOCIATIONS (ACTORS TO USE CASES) ==================== -->
  
  <!-- Administrador to CU-01 and CU-08 -->
  <line x1="145" y1="200" x2="290" y2="215" class="assoc-line" />
  <path d="M 145 220 L 220 220 L 220 690 L 280 695" class="assoc-line" />

  <!-- Coordinador to CU-01, CU-02, CU-04, CU-07 -->
  <path d="M 145 400 L 235 400 L 235 230 L 290 230" class="assoc-line" />
  <line x1="145" y1="410" x2="275" y2="375" class="assoc-line" />
  <line x1="145" y1="430" x2="290" y2="475" class="assoc-line" />
  <path d="M 145 385 L 250 325 L 750 325 L 800 345" class="assoc-line" />

  <!-- Paramédico to CU-01 and CU-05 -->
  <path d="M 145 610 L 210 610 L 210 240 L 295 240" class="assoc-line" />
  <line x1="145" y1="620" x2="540" y2="550" class="assoc-line" />

  <!-- Ciudadano to CU-10 -->
  <line x1="145" y1="795" x2="400" y2="805" class="assoc-line" />

  <!-- Demonio Sistema SGA (Right Side) Associations -->
  <!-- To CU-01.1 (bloqueo) -->
  <path d="M 1060 460 L 980 460 L 980 230 L 740 220" class="assoc-line" />
  <!-- To CU-03 (motor asignación) -->
  <line x1="1060" y1="480" x2="730" y2="375" class="assoc-line" />
  <!-- To CU-09 (vencimientos) -->
  <path d="M 1060 500 L 990 500 L 990 695 L 710 695" class="assoc-line" />
  <!-- To CU-06 (auditoría automática) -->
  <path d="M 1060 440 L 970 440 L 970 215 L 930 215" class="assoc-line" />

  <!-- ==================== UML STEREOTYPES: INCLUDE & EXTEND ==================== -->

  <!-- CU-01 extends to CU-01.1 (Bloqueo tras 5 intentos) -->
  <line x1="560" y1="215" x2="480" y2="215" class="extend-line" />
  <text x="495" y="205" class="stereo-text">&lt;&lt;extend&gt;&gt;</text>

  <!-- CU-02 includes CU-03 (Radicación invoca asignación automática) -->
  <line x1="465" y1="375" x2="520" y2="375" class="include-line" />
  <text x="466" y="365" class="stereo-inc">&lt;&lt;include&gt;&gt;</text>

  <!-- CU-04 extends CU-03 (Asignación manual con justificación extiende a la automática) -->
  <line x1="775" y1="375" x2="730" y2="375" class="extend-line" />
  <text x="732" y="365" class="stereo-text">&lt;&lt;extend&gt;&gt;</text>

  <!-- CU-08 includes CU-09 (Gestión ambulancias incluye validación REPS) -->
  <line x1="470" y1="695" x2="520" y2="695" class="include-line" />
  <text x="470" y="685" class="stereo-inc">&lt;&lt;include&gt;&gt;</text>

  <!-- CU-05 includes CU-11 (Cierre de servicio incluye facturación inmutable) -->
  <path d="M 720 552 L 805 552 L 805 610" class="include-line" />
  <text x="735" y="542" class="stereo-inc">&lt;&lt;include&gt;&gt;</text>

  <!-- CU-05 includes CU-06 (Cierre de servicio incluye auditoría) -->
  <path d="M 680 500 L 700 500 L 700 240 L 805 240 L 805 210" class="include-line" />
  <text x="705" y="260" class="stereo-inc">&lt;&lt;include&gt;&gt;</text>

  <!-- ==================== CONVENCIONES Y LEYENDA ==================== -->
  <g transform="translate(250, 835)">
    <rect x="0" y="0" width="700" height="35" fill="#EDF2F7" stroke="#CBD5E0" rx="4" />
    <text x="20" y="22" font-family="'Segoe UI', sans-serif" font-size="11px" font-weight="bold" fill="#4A5568">Convenciones UML:</text>
    
    <line x1="140" y1="18" x2="175" y2="18" class="assoc-line" />
    <text x="180" y="22" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#4A5568">Asociación Directa</text>

    <line x1="310" y1="18" x2="345" y2="18" class="include-line" />
    <text x="350" y="22" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#2C5282">&lt;&lt;include&gt;&gt; Inclusión Obligatoria</text>

    <line x1="530" y1="18" x2="565" y2="18" class="extend-line" />
    <text x="570" y="22" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#C53030">&lt;&lt;extend&gt;&gt; Extensión Condicional</text>
  </g>

</svg>
