<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 830" width="100%" height="100%">
  <defs>
    <style>
      .hdr-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 19px; font-weight: bold; fill: #1A365D; }
      .hdr-sub { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #4A5568; }
      .class-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1A202C; text-anchor: middle; }
      .class-attr { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.2px; fill: #2D3748; }
      .mult-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #2B6CB0; }
      .assoc-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 9.8px; font-style: italic; fill: #4A5568; }
      .pill { fill: #FFFFFF; opacity: 0.96; rx: 2; }

      .class-header-core { fill: #EBF8FF; stroke: #3182CE; stroke-width: 1.5; }
      .class-body-core { fill: #FFFFFF; stroke: #3182CE; stroke-width: 1.5; }

      .class-header-gen { fill: #FEFCBF; stroke: #D69E2E; stroke-width: 1.5; }
      .class-body-gen { fill: #FFFFFF; stroke: #D69E2E; stroke-width: 1.5; }

      .class-header-fin { fill: #F0FFF4; stroke: #38A169; stroke-width: 1.5; }
      .class-body-fin { fill: #FFFFFF; stroke: #38A169; stroke-width: 1.5; }

      .assoc-line { stroke: #4A5568; stroke-width: 1.5; fill: none; }
      .gen-line { stroke: #D69E2E; stroke-width: 1.6; fill: none; marker-end: url(#gen-triangle); }
      .gen-stem { stroke: #D69E2E; stroke-width: 1.6; fill: none; }
    </style>

    <marker id="gen-triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#FFFFFF" stroke="#D69E2E" stroke-width="1.6" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1260" height="830" fill="#F8FAFC" />

  <!-- Title Banner -->
  <rect x="20" y="15" width="1220" height="58" fill="#FFFFFF" stroke="#CBD5E0" rx="8" />
  <text x="40" y="39" class="hdr-title">SISTEMA GESTOR DE AMBULANCIAS (SGA) — MODELO DE DOMINIO CONCEPTUAL</text>
  <text x="40" y="57" class="hdr-sub">Evidencia G1-P2 · Criterio C3 (RAP 592373) · Aprendiz: MAET211 (Carpeta: G1-P2-estrada) · 13 Clases conceptuales puras sin métodos ni claves foráneas físicas</text>

  <!-- ==================== FILA 1 ==================== -->

  <!-- 1. Rol -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="180" height="26" class="class-header-core" />
    <text x="90" y="18" class="class-title">Rol</text>
    <rect x="0" y="26" width="180" height="74" class="class-body-core" />
    <text x="10" y="44" class="class-attr">• nombreRol</text>
    <text x="10" y="61" class="class-attr">• descripcionPermisos</text>
    <text x="10" y="78" class="class-attr">• estadoActivo : Booleano</text>
  </g>

  <!-- 2. Usuario -->
  <g transform="translate(305, 95)">
    <rect x="0" y="0" width="205" height="26" class="class-header-core" />
    <text x="102" y="18" class="class-title">Usuario</text>
    <rect x="0" y="26" width="205" height="104" class="class-body-core" />
    <text x="10" y="44" class="class-attr">• nombreCompleto</text>
    <text x="10" y="61" class="class-attr">• correoInstitucional</text>
    <text x="10" y="78" class="class-attr">• estadoCuenta</text>
    <text x="10" y="95" class="class-attr">• intentosFallidos</text>
    <text x="10" y="112" class="class-attr">• vigenciaContrasena</text>
  </g>

  <!-- 3. RegistroAuditoria -->
  <g transform="translate(590, 95)">
    <rect x="0" y="0" width="220" height="26" class="class-header-fin" />
    <text x="110" y="18" class="class-title">RegistroAuditoria</text>
    <rect x="0" y="26" width="220" height="99" class="class-body-fin" />
    <text x="10" y="44" class="class-attr">• fechaHoraEvento</text>
    <text x="10" y="61" class="class-attr">• accionRealizada</text>
    <text x="10" y="78" class="class-attr">• moduloAfectado</text>
    <text x="10" y="95" class="class-attr">• direccionOrigen</text>
    <text x="10" y="112" class="class-attr">• retencionAnios (5 años)</text>
  </g>

  <!-- 4. Ambulancia (Superclase) -->
  <g transform="translate(910, 95)">
    <rect x="0" y="0" width="240" height="26" class="class-header-gen" />
    <text x="120" y="18" class="class-title">Ambulancia</text>
    <rect x="0" y="26" width="240" height="114" class="class-body-gen" />
    <text x="10" y="44" class="class-attr">• placa</text>
    <text x="10" y="61" class="class-attr">• numeroUnidad</text>
    <text x="10" y="78" class="class-attr">• estadoOperativo</text>
    <text x="10" y="95" class="class-attr">• anioModelo</text>
    <text x="10" y="112" class="class-attr">• habilitacionREPS</text>
    <text x="10" y="129" class="class-attr">• vigenciaSoatTecno</text>
  </g>

  <!-- ==================== FILA 2 ==================== -->

  <!-- 5. Paciente -->
  <g transform="translate(40, 325)">
    <rect x="0" y="0" width="185" height="26" class="class-header-core" />
    <text x="92" y="18" class="class-title">Paciente</text>
    <rect x="0" y="26" width="185" height="104" class="class-body-core" />
    <text x="10" y="44" class="class-attr">• numeroIdentificacion</text>
    <text x="10" y="61" class="class-attr">• nombreCompleto</text>
    <text x="10" y="78" class="class-attr">• fechaNacimiento</text>
    <text x="10" y="95" class="class-attr">• antecedenteMedico</text>
    <text x="10" y="112" class="class-attr">• contactoFamiliar</text>
  </g>

  <!-- 6. PersonalSalud -->
  <g transform="translate(305, 300)">
    <rect x="0" y="0" width="210" height="26" class="class-header-core" />
    <text x="105" y="18" class="class-title">PersonalSalud</text>
    <rect x="0" y="26" width="210" height="114" class="class-body-core" />
    <text x="10" y="44" class="class-attr">• documentoIdentidad</text>
    <text x="10" y="61" class="class-attr">• nombreCompleto</text>
    <text x="10" y="78" class="class-attr">• tarjetaProfesional</text>
    <text x="10" y="95" class="class-attr">• rolTripulacion</text>
    <text x="10" y="112" class="class-attr">• certificacionSoporte</text>
    <text x="10" y="129" class="class-attr">• horasTurnoAcumuladas</text>
  </g>

  <!-- 7. ServicioAsistencial (Core) -->
  <g transform="translate(590, 310)">
    <rect x="0" y="0" width="230" height="26" class="class-header-core" />
    <text x="115" y="18" class="class-title">ServicioAsistencial</text>
    <rect x="0" y="26" width="230" height="149" class="class-body-core" />
    <text x="10" y="44" class="class-attr">• estadoServicio</text>
    <text x="10" y="61" class="class-attr">• fechaHoraDespacho</text>
    <text x="10" y="78" class="class-attr">• fechaHoraArribo</text>
    <text x="10" y="95" class="class-attr">• fechaHoraCierre</text>
    <text x="10" y="112" class="class-attr">• resultadoAtencion</text>
    <text x="10" y="129" class="class-attr">• estadoFinalPaciente</text>
    <text x="10" y="146" class="class-attr">• centroHospitalarioDestino</text>
    <text x="10" y="163" class="class-attr">• motivoAsignacionManual</text>
  </g>

  <!-- 8. TAB (Subclase) -->
  <g transform="translate(865, 340)">
    <rect x="0" y="0" width="165" height="26" class="class-header-gen" />
    <text x="82" y="18" class="class-title">TAB (Básica)</text>
    <rect x="0" y="26" width="165" height="59" class="class-body-gen" />
    <text x="10" y="44" class="class-attr">• kitInmovilizacion</text>
    <text x="10" y="61" class="class-attr">• soporteOxigenoBasico</text>
  </g>

  <!-- 9. TAM (Subclase) -->
  <g transform="translate(1050, 340)">
    <rect x="0" y="0" width="165" height="26" class="class-header-gen" />
    <text x="82" y="18" class="class-title">TAM (Medicalizada)</text>
    <rect x="0" y="26" width="165" height="74" class="class-body-gen" />
    <text x="10" y="44" class="class-attr">• monitorSignosVitales</text>
    <text x="10" y="61" class="class-attr">• desfibriladorBifasico</text>
    <text x="10" y="78" class="class-attr">• ventiladorMecanico</text>
  </g>

  <!-- ==================== FILA 3 ==================== -->

  <!-- 10. PQRS -->
  <g transform="translate(40, 565)">
    <rect x="0" y="0" width="185" height="26" class="class-header-core" />
    <text x="92" y="18" class="class-title">PQRS</text>
    <rect x="0" y="26" width="185" height="99" class="class-body-core" />
    <text x="10" y="44" class="class-attr">• codigoRadicado</text>
    <text x="10" y="61" class="class-attr">• tipoSolicitud</text>
    <text x="10" y="78" class="class-attr">• descripcionMotivo</text>
    <text x="10" y="95" class="class-attr">• fechaVencimientoLegal</text>
    <text x="10" y="112" class="class-attr">• estadoTramite</text>
  </g>

  <!-- 11. SolicitudEmergencia -->
  <g transform="translate(305, 565)">
    <rect x="0" y="0" width="210" height="26" class="class-header-core" />
    <text x="105" y="18" class="class-title">SolicitudEmergencia</text>
    <rect x="0" y="26" width="210" height="114" class="class-body-core" />
    <text x="10" y="44" class="class-attr">• codigoRadicado</text>
    <text x="10" y="61" class="class-attr">• fechaHoraLlamada</text>
    <text x="10" y="78" class="class-attr">• direccionIncidente</text>
    <text x="10" y="95" class="class-attr">• sintomatologiaInicial</text>
    <text x="10" y="112" class="class-attr">• nivelTriage</text>
    <text x="10" y="129" class="class-attr">• nombreReportante</text>
  </g>

  <!-- 12. Factura -->
  <g transform="translate(590, 565)">
    <rect x="0" y="0" width="230" height="26" class="class-header-fin" />
    <text x="115" y="18" class="class-title">Factura</text>
    <rect x="0" y="26" width="230" height="114" class="class-body-fin" />
    <text x="10" y="44" class="class-attr">• numeroFactura</text>
    <text x="10" y="61" class="class-attr">• fechaEmision</text>
    <text x="10" y="78" class="class-attr">• valorTotalServicio</text>
    <text x="10" y="95" class="class-attr">• estadoPago (Pagada/Mora)</text>
    <text x="10" y="112" class="class-attr">• diasMoraCalculados</text>
    <text x="10" y="129" class="class-attr">• inmutable : Booleano (Si/No)</text>
  </g>

  <!-- 13. NovedadOperativa -->
  <g transform="translate(910, 565)">
    <rect x="0" y="0" width="220" height="26" class="class-header-core" />
    <text x="110" y="18" class="class-title">NovedadOperativa</text>
    <rect x="0" y="26" width="220" height="99" class="class-body-core" />
    <text x="10" y="44" class="class-attr">• tipoIncidente (Falla/Accidente)</text>
    <text x="10" y="61" class="class-attr">• prioridad (Baja/Media/Alta)</text>
    <text x="10" y="78" class="class-attr">• descripcionDetallada</text>
    <text x="10" y="95" class="class-attr">• estadoResolucion</text>
    <text x="10" y="112" class="class-attr">• fechaReporte</text>
  </g>

  <!-- ==================== ZERO-CROSSING ASSOCIATIONS ==================== -->

  <!-- Rol -> Usuario -->
  <line x1="220" y1="145" x2="305" y2="145" class="assoc-line" />
  <text x="226" y="138" class="mult-text">1</text>
  <text x="282" y="138" class="mult-text">0..*</text>
  <text x="245" y="160" class="assoc-label">asigna</text>

  <!-- Usuario -> RegistroAuditoria -->
  <line x1="510" y1="155" x2="590" y2="155" class="assoc-line" />
  <text x="516" y="148" class="mult-text">1</text>
  <text x="568" y="148" class="mult-text">0..*</text>
  <text x="526" y="170" class="assoc-label">trazado en</text>

  <!-- Usuario -> PersonalSalud -->
  <line x1="410" y1="225" x2="410" y2="300" class="assoc-line" />
  <text x="416" y="242" class="mult-text">1</text>
  <text x="416" y="290" class="mult-text">0..1</text>
  <text x="360" y="268" class="assoc-label">perfila</text>

  <!-- PersonalSalud -> ServicioAsistencial -->
  <line x1="515" y1="370" x2="590" y2="370" class="assoc-line" />
  <text x="522" y="363" class="mult-text">1..*</text>
  <text x="568" y="363" class="mult-text">1..*</text>
  <text x="530" y="385" class="assoc-label">tripula</text>

  <!-- Ambulancia -> ServicioAsistencial (Corridor x=842 clear of TAB 865!) -->
  <path d="M 820 355 L 842 355 L 842 170 L 910 170" class="assoc-line" />
  <text x="824" y="346" class="mult-text">0..*</text>
  <text x="892" y="163" class="mult-text">1</text>
  <rect x="815" y="255" width="58" height="14" class="pill" />
  <text x="818" y="266" class="assoc-label">atiende con</text>

  <!-- Generalización limpia: Ambulancia -> TAB & TAM (y=235..340 wide open!) -->
  <path d="M 947 340 L 947 290 L 1132 290 L 1132 340" class="gen-stem" />
  <line x1="1030" y1="290" x2="1030" y2="236" class="gen-line" />

  <!-- Paciente -> PQRS -->
  <line x1="132" y1="455" x2="132" y2="565" class="assoc-line" />
  <text x="138" y="472" class="mult-text">0..1</text>
  <text x="138" y="555" class="mult-text">0..*</text>
  <text x="140" y="515" class="assoc-label">radica</text>

  <!-- Paciente -> SolicitudEmergencia (Corridor x=262) -->
  <path d="M 225 405 L 262 405 L 262 625 L 305 625" class="assoc-line" />
  <text x="230" y="397" class="mult-text">1</text>
  <text x="282" y="618" class="mult-text">1..*</text>
  <rect x="235" y="505" width="44" height="14" class="pill" />
  <text x="240" y="516" class="assoc-label">origina</text>

  <!-- SolicitudEmergencia -> ServicioAsistencial (Corridor x=552) -->
  <path d="M 515 610 L 552 610 L 552 445 L 590 445" class="assoc-line" />
  <text x="520" y="603" class="mult-text">1</text>
  <text x="572" y="438" class="mult-text">1</text>
  <rect x="528" y="520" width="50" height="14" class="pill" />
  <text x="530" y="531" class="assoc-label">despacha</text>

  <!-- ServicioAsistencial -> Factura -->
  <line x1="705" y1="485" x2="705" y2="565" class="assoc-line" />
  <text x="712" y="502" class="mult-text">1</text>
  <text x="712" y="555" class="mult-text">0..1</text>
  <text x="646" y="530" class="assoc-label">liquida en</text>

  <!-- ServicioAsistencial -> NovedadOperativa (Corridor x=842 descending from y=465, strictly non-overlapping!) -->
  <path d="M 820 465 L 842 465 L 842 625 L 910 625" class="assoc-line" />
  <text x="824" y="458" class="mult-text">1</text>
  <text x="888" y="618" class="mult-text">0..*</text>
  <rect x="826" y="540" width="38" height="14" class="pill" />
  <text x="829" y="551" class="assoc-label">reporta</text>

  <!-- ==================== LEYENDA TÉCNICA ==================== -->
  <g transform="translate(40, 735)">
    <rect x="0" y="0" width="1175" height="72" fill="#EDF2F7" stroke="#CBD5E0" rx="6" />
    <text x="20" y="25" font-family="'Segoe UI', sans-serif" font-size="11.5px" font-weight="bold" fill="#2D3748">Normas Técnicas Aplicadas en el Modelo de Dominio (Criterio C3 / Sección 7 Regla 5 de la Rúbrica):</text>
    <text x="20" y="44" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#4A5568">1. Clases Conceptuales Puras (13 Clases): Modelan el dominio completo del SGA, libres de métodos, claves foráneas físicas o tipos primitivos de programación (ej. Booleano Si/No).</text>
    <text x="20" y="59" font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#4A5568">2. Generalización y Ruteo Perimetral: Especialización normativa TAB/TAM bajo Res. 3100/2019 y cuadrícula ortogonal con cero cruces ni solapamientos de herencia.</text>
  </g>

</svg>
